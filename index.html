<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小鲸教练 · 训练仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Fira Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#050B18;
  color:#E8EEF7;
  min-height:100vh;
  overscroll-behavior:contain;
}
code,pre,.mono{font-family:'Fira Code',monospace}

/* ===== ACCESSIBILITY ===== */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;top:-100px;left:1rem;z-index:1000;padding:0.75rem 1.25rem;
  background:#3f9df6;color:#fff;border-radius:8px;font-weight:600;text-decoration:none;transition:top 0.2s}
.skip-link:focus{top:1rem}

/* ===== FOCUS RING ===== */
:focus-visible{outline:2px solid #3f9df6;outline-offset:2px;border-radius:4px}
.tab-btn:focus-visible,.toggle-header:focus-visible,.ach-badge:focus-visible{outline:2px solid #3f9df6;outline-offset:2px;border-radius:8px}

/* ===== SKELETON LOADING ===== */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{
  background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;
}
.skeleton-card{height:120px;flex:1;min-width:200px;max-width:320px;border-radius:16px}
.skeleton-chart{height:300px;width:100%;border-radius:16px}
.skeleton-h1{height:2rem;width:300px;margin:1rem 0}
.skeleton-tabs{height:2.5rem;width:250px;margin:1.5rem 0 0.5rem}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.12)}

/* ===== ANIMATIONS ===== */
@keyframes fade-in-up{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes pulse-glow{
  0%,100%{box-shadow:0 0 24px var(--glow-color,rgba(217,119,6,0.3))}
  50%{box-shadow:0 0 48px var(--glow-color,rgba(217,119,6,0.5))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important}
}

/* ===== LAYOUT ===== */
#app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 2rem 2rem}

/* ===== AURORA 动态极光背景 ===== */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora-parallax{position:absolute;inset:-20%;will-change:transform;
  transition:transform 0.5s ease-out}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform}
.b1{width:920px;height:920px;top:-18%;right:-12%;
  background:radial-gradient(circle at 35% 35%, rgba(63,157,246,0.32), rgba(59,130,246,0.07) 55%, transparent 70%);
  animation:drift-a 26s ease-in-out infinite alternate}
.b2{width:780px;height:780px;bottom:-22%;left:-14%;
  background:radial-gradient(circle at 60% 40%, rgba(129,140,248,0.22), rgba(99,102,241,0.06) 55%, transparent 70%);
  animation:drift-b 34s ease-in-out infinite alternate;animation-delay:-8s}
.b3{width:560px;height:560px;top:38%;left:40%;
  background:radial-gradient(circle at 50% 50%, rgba(34,211,238,0.12), transparent 65%);
  animation:drift-c 44s ease-in-out infinite alternate;animation-delay:-20s}
@keyframes drift-a{
  from{transform:translate3d(0,0,0) scale(1)}
  to{transform:translate3d(140px,90px,0) scale(1.12)}
}
@keyframes drift-b{
  from{transform:translate3d(0,0,0) scale(1.1)}
  to{transform:translate3d(-120px,-70px,0) scale(1)}
}
@keyframes drift-c{
  from{transform:translate3d(0,0,0) scale(1.05)}
  to{transform:translate3d(80px,-100px,0) scale(0.95)}
}
/* 视差: 鼠标移动时各层以不同系数反方向错位 (--px/--py 由 JS 注入) */
.p1{transform:translate3d(calc(var(--px,0)*40px),calc(var(--py,0)*30px),0)}
.p2{transform:translate3d(calc(var(--px,0)*-30px),calc(var(--py,0)*-20px),0)}
.p3{transform:translate3d(calc(var(--px,0)*20px),calc(var(--py,0)*15px),0)}
/* 鼠标追踪光晕 */
.mouse-glow{position:absolute;top:0;left:0;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle, rgba(63,157,246,0.13), transparent 60%);
  transform:translate3d(calc(var(--mx,50vw) - 310px),calc(var(--my,30vh) - 310px),0);
  transition:transform 0.6s cubic-bezier(0.22,1,0.36,1)}
@media (hover:none){.mouse-glow{display:none}}
@media (prefers-reduced-motion:reduce){
  .aurora-blob{animation:none!important}
  .aurora-parallax{transition:none}
  .mouse-glow{display:none}
}

/* ===== HEADER ===== */
.header{
  position:sticky;top:0;z-index:50;
  background:rgba(5,11,24,0.88);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(96,165,250,0.16);
  padding:1rem 2rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.header h1{font-size:1.25rem;font-weight:800;letter-spacing:-0.02em}

/* ===== VP 登录（打钩权限：仅 /dash 线上同源可用，本地 8080 只读降级）===== */
.auth-area{display:flex;align-items:center;gap:0.5rem}
.auth-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  color:#E0E0E0;padding:0.4rem 0.9rem;border-radius:0.5rem;font-size:0.8125rem;cursor:pointer}
.auth-btn:hover{background:rgba(255,255,255,0.12)}
.auth-user{font-size:0.8125rem;color:rgba(255,255,255,0.7)}
.auth-form{display:flex;gap:0.4rem;align-items:center}
.auth-form input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
  color:#fff;border-radius:0.4rem;padding:0.35rem 0.6rem;font-size:0.8125rem;width:8rem}
.auth-form button{background:rgba(63,157,246,0.16);border:1px solid rgba(63,157,246,0.42);
  color:#8ECDFF;border-radius:0.4rem;padding:0.35rem 0.7rem;font-size:0.8125rem;cursor:pointer}
.auth-form button[type="button"]{background:transparent;border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6)}

/* 复习队列项：勾选框 = 复习通过（独立 AC）标记 */
.queue-item{display:flex;align-items:center;gap:0.5rem}
.queue-check{flex-shrink:0;display:inline-flex;align-items:center;margin-left:auto}
.queue-check input{width:1rem;height:1rem;accent-color:#3f9df6;cursor:pointer}

/* ===== TABS ===== */
.tab-bar{display:flex;gap:0.25rem;margin:1.5rem 0 0.5rem}
.tab-btn{
  padding:0.5rem 0.875rem;border-radius:8px;border:none;cursor:pointer;
  font-size:0.875rem;font-weight:500;color:rgba(255,255,255,0.45);
  background:transparent;transition:all 0.2s;
  font-family:inherit;min-height:44px;min-width:44px;
}
.tab-btn:hover{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)}
.tab-btn.active{color:#9ED0FF;background:rgba(63,157,246,0.16);box-shadow:0 0 14px rgba(63,157,246,0.14)}

/* ===== CARD ===== */
.card{
  padding:1.25rem;border-radius:16px;
  background:rgba(9,18,36,0.88);backdrop-filter:blur(20px);
  border:1px solid rgba(148,197,255,0.10);
  box-shadow:inset 0 1px 0 rgba(148,197,255,0.05),0 4px 24px rgba(0,0,0,0.32);
  transition:all 0.3s ease-out;
}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.card-accent{border-width:1px;box-shadow:0 4px 24px var(--card-glow-strong)}

/* ===== METRIC CARD ===== */
.metric-card{min-width:200px;flex:1;max-width:320px}
.metric-title{font-size:0.75rem;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7}
.metric-value{font-size:2rem;font-weight:800;line-height:1.2}
.metric-sub{font-size:0.75rem;margin-top:0.25rem;opacity:0.6}

/* ===== ROW / GRID HELPERS ===== */
.flex-row{display:flex;gap:1rem;flex-wrap:wrap}
.flex-1{flex:1}
.items-center{align-items:center}
.items-stretch{align-items:stretch}
.justify-center{justify-content:center}
.gap-0{gap:0}
.gap-1{gap:0.25rem}
.gap-2{gap:0.5rem}
.gap-3{gap:0.75rem}
.gap-4{gap:1rem}
.mt-1{margin-top:0.25rem}
.mt-2{margin-top:0.5rem}
.mt-4{margin-top:1rem}
.mt-6{margin-top:1.5rem}
.mt-10{margin-top:2.5rem}
.mt-12{margin-top:3rem}
.mb-2{margin-bottom:0.5rem}
.mb-4{margin-bottom:1rem}
.mb-6{margin-bottom:1.5rem}
.w-full{width:100%}

/* ===== STREAK FLAME ===== */
.flame-row{display:flex;align-items:baseline;gap:0.25rem}

/* ===== WEEK COMPARISON ===== */
.week-label{font-size:0.75rem;font-weight:500;text-transform:uppercase;opacity:0.5;margin-bottom:0.5rem}
.week-val{font-size:1.75rem;font-weight:700}
.week-delta{font-size:0.875rem;font-weight:600}
.week-vs{font-size:0.75rem;opacity:0.4}

/* ===== PROGRESS BAR ===== */
.progress-track{width:100%;height:0.5rem;border-radius:999px;overflow:hidden;background:rgba(255,255,255,0.06);margin-top:0.5rem}
.progress-fill{height:100%;border-radius:999px;transition:width 800ms ease-out}

/* ===== CHECK-IN BANNER ===== */
.checkin-banner{
  margin-top:1rem;padding:0.75rem 1.25rem;border-radius:12px;
  background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);
  color:#FCA5A5;font-size:0.875rem;font-weight:500;
  display:flex;align-items:center;gap:0.5rem;
  animation:fade-in-up 400ms ease-out both;
}
.checkin-banner .banner-sub{opacity:0.6;font-size:0.75rem;font-weight:400}

/* ===== COACH TIPS ===== */
.coach-card{margin-top:1.5rem}
.coach-header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.coach-toggle{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.7);font-size:0.75rem;font-weight:600;
  padding:0.35rem 0.85rem;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:all 0.2s ease-out;
}
.coach-toggle:hover{background:rgba(255,255,255,0.1);color:#fff}
.coach-tips{display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:0.875rem}
.coach-tip{
  flex:1;min-width:280px;padding:0.75rem 1rem;border-radius:12px;
  display:flex;align-items:flex-start;gap:0.625rem;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);
  transition:all 0.25s ease-out;
}
.coach-tip:hover{background:rgba(255,255,255,0.05);transform:translateY(-1px)}
.coach-tip .tip-icon{font-size:1.125rem;line-height:1.4}
.coach-tip .tip-text{font-size:0.8125rem;color:rgba(255,255,255,0.75);line-height:1.5}
.coach-section{margin-top:1.125rem;padding-top:1rem;border-top:1px dashed rgba(255,255,255,0.08)}
.coach-sec-title{font-size:0.8125rem;font-weight:700;color:rgba(255,255,255,0.55);margin-bottom:0.25rem;letter-spacing:0.02em}

/* ===== ACHIEVEMENT BADGE ===== */
.ach-grid{display:flex;flex-wrap:wrap;gap:0.75rem}
.ach-badge{
  padding:0.75rem;border-radius:12px;border:1px solid;
  min-width:110px;max-width:160px;text-align:center;
  transition:all 0.3s ease-out;cursor:pointer;position:relative;
}
.ach-badge:hover{transform:translateY(-2px)}
.ach-icon{font-size:1.5rem}
.ach-name{font-size:0.7rem;margin-top:0.25rem;font-weight:700}
.ach-progress{font-size:0.65rem}
/* 自定义 tooltip（替代原生 title，观感统一且即时） */
.ach-badge::after{
  content:attr(data-tip);
  position:absolute;left:50%;bottom:calc(100% + 8px);
  transform:translateX(-50%) scale(0.9);
  background:rgba(17,24,39,0.98);border:1px solid rgba(255,255,255,0.12);
  padding:0.5rem 0.75rem;border-radius:8px;
  font-size:0.75rem;line-height:1.5;color:#E0E0E0;
  white-space:pre-line;text-align:center;
  width:max-content;max-width:200px;
  opacity:0;pointer-events:none;transition:opacity 0.2s,transform 0.2s;
  z-index:20;box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.ach-badge:hover::after{opacity:1;transform:translateX(-50%) scale(1)}
/* 顶部 badge 的 tooltip 翻到下方显示，避免溢出视口 */
.ach-badge:first-child::after{bottom:auto;top:calc(100% + 8px)}

/* ===== TOGGLE ===== */
.toggle-header{
  display:flex;align-items:center;width:100%;cursor:pointer;
  padding:0.75rem 0.5rem;transition:background 0.2s;
  border-radius:8px;user-select:none;min-height:44px;
}
.toggle-header:hover{background:rgba(255,255,255,0.03)}
.toggle-body{overflow:hidden;transition:max-height 500ms cubic-bezier(0.4,0,0.2,1)}

/* ===== SECTION HEADING ===== */
.section-heading{display:flex;align-items:center;gap:0.75rem;margin:2.5rem 0 1rem}
.section-heading h2{font-size:1.125rem;font-weight:700;letter-spacing:-0.01em;white-space:nowrap}
.section-heading .line{flex:1;height:1px;background:rgba(255,255,255,0.06)}

/* ===== SUBMISSION TABLE ===== */
.sub-row{display:flex;width:100%;padding:0.5rem 0;align-items:center;transition:all 0.15s}
.sub-row:not(:last-child){border-bottom:1px solid rgba(255,255,255,0.04)}
.sub-date{width:5.5rem;font-size:0.75rem;color:rgba(255,255,255,0.3)}
.sub-time{width:3rem;font-size:0.75rem;color:rgba(255,255,255,0.25)}
.sub-pid{width:5rem;font-size:0.8125rem;font-weight:500;font-family:'Fira Code',monospace}
.sub-plat{width:5rem;font-size:0.75rem;color:rgba(255,255,255,0.3)}
.sub-verdict{font-size:0.8125rem}

/* ===== CHART CONTAINER ===== */
.chart-box{border-radius:16px;padding:1.5rem}
.chart-box h3{font-size:0.9375rem;font-weight:700;margin-bottom:0.5rem;color:#E0E0E0}
.chart-inner{width:100%}

/* ===== FOOTER ===== */
.footer{text-align:center;margin-top:3rem;margin-bottom:1.5rem;font-size:0.75rem;color:rgba(255,255,255,0.2)}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  #app{padding:0 1rem 1rem}
  .metric-card{min-width:140px;max-width:100%}
  .flex-row{flex-direction:column}
}
</style>
</head>
<body>

<a href="#main-content" class="skip-link">跳到主内容</a>

<!-- AURORA 动态极光背景（纯装饰，不参与交互） -->
<div class="aurora" aria-hidden="true">
  <div class="aurora-parallax p1"><div class="aurora-blob b1"></div></div>
  <div class="aurora-parallax p2"><div class="aurora-blob b2"></div></div>
  <div class="aurora-parallax p3"><div class="aurora-blob b3"></div></div>
  <div class="mouse-glow" id="mouseGlow"></div>
</div>

<div class="header" role="banner">
  <h1>🐋 小鲸教练 · 训练仪表盘</h1>
  <div id="authArea" class="auth-area"></div>
</div>

<!-- SKELETON LOADING -->
<div id="skeleton" style="max-width:1440px;margin:0 auto;padding:2rem">
  <div class="skeleton skeleton-tabs"></div>
  <div class="flex-row mt-4" style="gap:1rem">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
  <div class="skeleton skeleton-chart" style="margin-top:2.5rem"></div>
</div>

<div id="app" style="display:none" role="main" aria-label="训练仪表盘">
  <div id="main-content"></div>

  <!-- 今日未打卡提醒（渲染后按需显示） -->
  <div id="checkinBanner" class="checkin-banner" style="display:none" role="status"></div>

  <!-- Tabs -->
  <div class="tab-bar" id="tabBar" role="tablist" aria-label="队员切换"></div>

  <!-- Metric Cards Row -->
  <div class="flex-row items-stretch mt-4" id="metricRow"></div>

  <!-- Week Comparison Row -->
  <div class="flex-row items-stretch mt-4" id="weekRow"></div>

  <!-- Coach Tips -->
  <div id="coachRow"></div>

  <!-- Unearned Achievements -->
  <div class="section-heading"><h2 id="achUnearnedTitle">🎯 待解锁成就</h2><div class="line"></div></div>
  <div class="ach-grid" id="achUnearned" role="list" aria-label="待解锁成就列表"></div>

  <!-- Earned Achievements (collapsible) -->
  <div class="card w-full mt-6">
    <div class="toggle-header" id="toggleEarned" onclick="toggleEarned()" onkeydown="if(event.key==='Enter'||event.key===' ') {event.preventDefault();toggleEarned()}" tabindex="0" role="button" aria-expanded="false" aria-label="展开已获得成就">
      <span id="toggleLabel" style="font-size:0.9375rem;font-weight:700;color:#E0E0E0">▸ 已获得成就</span>
    </div>
    <div class="toggle-body" id="earnedBody" style="max-height:0" role="region" aria-labelledby="toggleLabel">
      <div class="ach-grid mt-4" id="achEarned" role="list" aria-label="已获得成就列表"></div>
    </div>
  </div>

  <!-- Charts - Row 1: Rating curve -->
  <div class="section-heading"><h2>📈 成长轨迹</h2><div class="line"></div></div>
  <div class="card chart-box w-full">
    <h3>COAST Rating 对比曲线</h3>
    <div class="chart-inner" id="chartRatingComp" style="height:420px" role="img" aria-label="Rating 对比曲线图"></div>
  </div>

  <!-- Charts - Row 2: Calendar + Verdict -->
  <div class="flex-row mt-4">
    <div class="card chart-box flex-1">
      <h3 id="calTitle">训练日历</h3>
      <div class="chart-inner" id="chartCalendar" style="height:280px" role="img" aria-label="训练日历热力图"></div>
    </div>
    <div class="card chart-box flex-1">
      <h3 id="verdictTitle">判题分布</h3>
      <div class="chart-inner" id="chartVerdict" style="height:280px" role="img" aria-label="判题结果分布图"></div>
    </div>
  </div>

  <!-- Charts - Row 3: Difficulty + Weekly -->
  <div class="flex-row mt-4">
    <div class="card chart-box flex-1">
      <h3 id="diffTitle">难度递进</h3>
      <div class="chart-inner" id="chartDiff" style="height:360px" role="img" aria-label="难度递进散点图"></div>
    </div>
    <div class="card chart-box flex-1">
      <h3 id="weeklyTitle">每周 AC 题数</h3>
      <div class="chart-inner" id="chartWeekly" style="height:360px" role="img" aria-label="每周 AC 柱状图"></div>
    </div>
  </div>

  <!-- Charts - Row 4: Topic heatmap -->
  <div class="card chart-box w-full mt-4">
    <h3 id="topicTitle">专题掌握</h3>
    <div class="chart-inner" id="chartTopic" style="height:400px" role="img" aria-label="专题掌握堆叠柱状图"></div>
  </div>

  <!-- Team Section -->
  <div class="section-heading"><h2>👥 团队</h2><div class="line"></div></div>
  <div class="flex-row">
    <div class="card chart-box flex-1">
      <h3>COAST 团队 Rating 对比</h3>
      <div class="chart-inner" id="chartTeam" style="height:360px" role="img" aria-label="团队 Rating 对比图"></div>
    </div>
    <div class="card chart-box flex-1">
      <h3>📋 最近提交</h3>
      <div id="subTable" style="margin-top:0.75rem" role="table" aria-label="最近提交记录"></div>
    </div>
  </div>

  <div class="footer">🐋 小鲸教练 · 数据: training.db · 图表: ECharts · 托管: GitHub Pages · <span id="footerTime"></span></div>
</div>

<script>
// ===== ACCENT COLOR PALETTE（蓝基调冷色阶 + 语义色）=====
const ACCENTS = {
  // 蓝基调冷色阶：指标卡/周对比/里程碑统一走青→蓝→靛
  blue:   {color:'#3f9df6',glow:'rgba(63,157,246,0.15)'},   // 品牌蓝
  azure:  {color:'#60a5fa',glow:'rgba(96,165,250,0.15)'},
  sky:    {color:'#38bdf8',glow:'rgba(56,189,248,0.15)'},
  cyan:   {color:'#22d3ee',glow:'rgba(34,211,238,0.15)'},
  indigo: {color:'#818cf8',glow:'rgba(129,140,248,0.15)'},
  teal:   {color:'#2dd4bf',glow:'rgba(45,212,191,0.15)'},    // VP AC 青（备用）
  // 语义色：保留含义，不参与蓝基调
  green:  {color:'#10B981',glow:'rgba(16,185,129,0.15)'},   // AC/达成
  red:    {color:'#f87171',glow:'rgba(248,113,113,0.15)'},  // 断训/危险/下跌
  amber:  {color:'#f59e0b',glow:'rgba(245,158,11,0.15)'},   // (备用)
  yellow: {color:'#facc15',glow:'rgba(250,204,21,0.15)'},   // (备用)
  gray:   {color:'#94a3b8',glow:'rgba(148,163,184,0.15)'},
};

function accentStyle(colorName) {
  const a = ACCENTS[colorName] || ACCENTS.blue;
  const glowStrong = a.glow.replace('0.15','0.25');
  return {
    background: `linear-gradient(180deg, ${glowStrong} 0%, rgba(8,16,34,0.92) 100%)`,
    backdropFilter: 'blur(20px)',
    border: `1px solid ${a.color}66`,
    boxShadow: `0 4px 24px ${glowStrong}`,
  };
}

function accentColor(name) {
  return (ACCENTS[name]||ACCENTS.blue).color;
}

// ===== GLOBAL STATE =====
let DATA = null;
let currentHandle = 'Mianii';
let charts = {}; // echarts instances

// ===== INIT =====
async function init() {
  try {
    const resp = await fetch('data.json', {cache: 'no-cache'});
    DATA = await resp.json();
  } catch(e) {
    document.getElementById('skeleton').innerHTML =
      '<div style="text-align:center;padding:4rem;color:#EF4444">⚠️ 无法加载 data.json，请确认文件存在</div>';
    return;
  }
  currentHandle = window.location.hash.slice(1) || DATA.handles[0];
  if (!DATA.members[currentHandle]) currentHandle = DATA.handles[0];

  // 必须先显示 app 容器，否则 ECharts 在 display:none 里算不出尺寸
  document.getElementById('skeleton').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // Footer 数据更新时间
  if (DATA.exportedAt) {
    document.getElementById('footerTime').textContent = '数据更新于 ' + DATA.exportedAt;
  }

  buildTabs();
  renderAll();
  initAuth(); // 登录态（打钩权限）与数据加载并行

  // 容器可见后再触发一次 resize，确保图表填满
  requestAnimationFrame(() => {
    Object.values(chartInstances).forEach(c => c.resize());
  });

  window.addEventListener('hashchange', () => {
    const h = window.location.hash.slice(1);
    if (h && DATA.members[h] && h !== currentHandle) {
      currentHandle = h;
      renderAll();
    }
  });
}

// ===== TABS =====
function buildTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = DATA.handles.map(h => {
    const label = DATA.labels[h] || h;
    const sel = h === currentHandle;
    return `<button class="tab-btn${sel?' active':''}" role="tab" aria-selected="${sel}"
      onclick="switchMember('${h}')" tabindex="${sel?'0':'-1'}">${label}</button>`;
  }).join('');
}

function switchMember(h) {
  if (h === currentHandle) return;
  window.location.hash = h;
}

// Update tab states after render
function updateTabs() {
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const h = DATA.handles[i];
    const sel = h === currentHandle;
    btn.classList.toggle('active', sel);
    btn.setAttribute('aria-selected', sel);
    btn.setAttribute('tabindex', sel ? '0' : '-1');
  });
}

// ===== RENDER ALL =====
function renderAll() {
  const m = DATA.members[currentHandle];
  const label = DATA.labels[currentHandle] || currentHandle;

  updateTabs();
  renderMetrics(m, label);
  renderWeekRow(m);
  renderCoach(m);
  renderCheckin(m);
  renderAchievements(m);
  renderCharts(m, label);
  renderTeam(m, label);
}

// 本地时区的 YYYY-MM-DD（submitted_at 存的就是本地时间）
function localDateStr(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

// ===== 今日打卡提醒 =====
function renderCheckin(m) {
  const el = document.getElementById('checkinBanner');
  const today = localDateStr(new Date());
  if (!m.lastSubmitDate || m.lastSubmitDate >= today) {
    el.style.display = 'none';
    return;
  }
  const days = Math.round((new Date(today) - new Date(m.lastSubmitDate)) / 86400000);
  el.style.display = 'flex';
  el.innerHTML = `🔥 <span>今天还没看到你的提交${days > 1 ? `（已 ${days} 天）` : ''}</span>
    <span class="banner-sub">数据更新于 ${DATA.exportedAt}，之后提交随下次同步刷新</span>`;
}

// ===== 小鲸教练说（折叠版：折叠=快讯，展开=薄弱点/冲刺点/复习）=====
function coachTipHTML(t) {
  return `<div class="coach-tip">
    <span class="tip-icon">${t.icon}</span>
    <span class="tip-text">${t.text}</span>
  </div>`;
}

// 复习队列项：登录且是本人 → 带勾选框（复习通过）；否则纯文本只读
function queueTipHTML(item, isMine) {
  const pid = String(item.problem_id || '').replace(/'/g, "\\'");
  const plat = String(item.platform || '');
  const cb = isMine
    ? `<label class="queue-check" title="标记复习通过（独立 AC）">
         <input type="checkbox" onchange="checkQueue(this,'${pid}','${plat}')">
       </label>`
    : '';
  return `<div class="coach-tip queue-item">
    <span class="tip-icon">${item.icon}</span>
    <span class="tip-text">${item.text}</span>${cb}
  </div>`;
}

function toggleCoach() {
  const btn = document.getElementById('coachToggle');
  const details = document.getElementById('coachDetails');
  if (!btn || !details) return;
  const open = details.style.display !== 'none';
  details.style.display = open ? 'none' : 'block';
  btn.innerHTML = open ? '展开全部 ▾' : '收起 ▴';
  btn.setAttribute('aria-expanded', String(!open));
}

function renderCoach(m) {
  const el = document.getElementById('coachRow');
  let tips = m.coachTips;
  // 兜底：data.json 未刷新时 coachTips 还是旧数组格式
  if (Array.isArray(tips)) {
    if (!tips.length) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <div class="card coach-card">
        <div class="metric-title">🐋 小鲸教练说</div>
        <div class="coach-tips">${tips.map(coachTipHTML).join('')}</div>
      </div>`;
    return;
  }
  tips = tips || {};
  const briefs = tips.collapsed || [];
  const sections = (tips.sections || []).filter(s => s.items && s.items.length);
  if (!briefs.length && !sections.length) { el.innerHTML = ''; return; }

  el.innerHTML = `
    <div class="card coach-card">
      <div class="coach-header">
        <span class="metric-title">🐋 小鲸教练说</span>
        ${sections.length ? `<button class="coach-toggle" id="coachToggle" aria-expanded="false">展开全部 ▾</button>` : ''}
      </div>
      ${briefs.length ? `<div class="coach-tips">${briefs.map(coachTipHTML).join('')}</div>` : ''}
      <div id="coachDetails" style="display:none">
        ${sections.map(s => `
          <div class="coach-section">
            <div class="coach-sec-title">${s.icon} ${s.title}</div>
            <div class="coach-tips">${s.items.map(item => s.key === 'queue'
              ? queueTipHTML(item, MY_COACH_HANDLE === currentHandle)
              : coachTipHTML(item)).join('')}</div>
          </div>`).join('')}
      </div>
    </div>`;
  const btn = document.getElementById('coachToggle');
  if (btn) btn.onclick = toggleCoach;
}

// ===== VP 登录（打钩权限：登录且是本人才能勾自己的题）=====
// 身份来自服务器 session。GitHub Pages 跨域场景浏览器拒收 cookie，
// 走 token 模式：login 返回的 token 存 localStorage，请求带 Authorization header。
// /dash 同源场景 cookie 仍可用（两者兼容）。
let MY_COACH_HANDLE = null; // 登录后 = 别名映射到教练库的 handle；未登录 null
const VP_HANDLE_ALIASES = {'Mianiii': 'Mianii', 'rhz666': 'lywyb'}; // VP 名 → 教练库名
const API_BASE = 'https://101.200.232.38'; // 打钩 API（Caddy 443 HTTPS 反代 8081；Pages 跨域 / 本地 8080 同用）

function authHeaders() {
  const t = localStorage.getItem('vp_token');
  return t ? {'Authorization': 'Bearer ' + t} : {};
}

async function initAuth() {
  try {
    const resp = await fetch(API_BASE + '/api/auth/me', {cache: 'no-cache', headers: authHeaders()});
    const data = await resp.json();
    const h = data.user && data.user.handle ? data.user.handle : null;
    MY_COACH_HANDLE = h ? (VP_HANDLE_ALIASES[h] || h) : null;
  } catch(e) {
    // 网络不可达（本地 8080 / Pages 后端宕机）→ 静默只读降级
    MY_COACH_HANDLE = null;
  }
  renderAuthArea();
  renderAll(); // 队列勾选框按登录态重渲染（刷新场景 initAuth 也必须重渲染）
}

function renderAuthArea() {
  const el = document.getElementById('authArea');
  if (!el) return;
  if (!MY_COACH_HANDLE) {
    el.innerHTML = `<button class="auth-btn" onclick="toggleAuthForm()">🔐 登录后打钩</button>`;
  } else {
    el.innerHTML = `<span class="auth-user">👤 ${MY_COACH_HANDLE}</span>
      <button class="auth-btn" onclick="doLogout()">退出</button>`;
  }
}

function toggleAuthForm() {
  const area = document.getElementById('authArea');
  if (area.querySelector('.auth-form')) { area.innerHTML = ''; renderAuthArea(); return; }
  area.innerHTML = `<form class="auth-form" onsubmit="doLogin(event)">
    <input id="authHandle" placeholder="handle" autocomplete="username" required>
    <input id="authPass" type="password" placeholder="密码" autocomplete="current-password" required>
    <button type="submit">登录</button>
    <button type="button" onclick="cancelAuthForm()">取消</button>
  </form>`;
  document.getElementById('authHandle').focus();
}

function cancelAuthForm() { document.getElementById('authArea').innerHTML = ''; renderAuthArea(); }

async function doLogin(ev) {
  ev.preventDefault();
  const handle = document.getElementById('authHandle').value.trim();
  const password = document.getElementById('authPass').value;
  try {
    const resp = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({handle, password}),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) { alert(data.detail || '登录失败'); return; }
    if (data.token) localStorage.setItem('vp_token', data.token); // 跨域 token 模式
    MY_COACH_HANDLE = data.user ? (VP_HANDLE_ALIASES[data.user.handle] || data.user.handle) : null;
    renderAuthArea();
    renderAll(); // 队列勾选框按新身份重渲染
  } catch(e) { alert('网络错误，登录失败'); }
}

async function doLogout() {
  localStorage.removeItem('vp_token');
  try { await fetch(API_BASE + '/api/auth/logout', {method: 'POST', headers: authHeaders()}); } catch(e) {}
  MY_COACH_HANDLE = null;
  renderAuthArea();
  renderAll();
}

// 打钩 = 复习通过（独立 AC）→ stage+1 / 出师
async function checkQueue(cb, problemId, platform) {
  if (!MY_COACH_HANDLE) { toggleAuthForm(); cb.checked = false; return; }
  const row = cb.closest('.queue-item');
  cb.disabled = true; // 防连点（双击会连调两次接口）
  try {
    const resp = await fetch(API_BASE + '/api/review/check', {
      method: 'POST', headers: Object.assign({'Content-Type': 'application/json'}, authHeaders()),
      body: JSON.stringify({problem_id: problemId, platform}),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) { alert(data.detail || '打钩失败'); cb.checked = false; cb.disabled = false; return; }
    if (data.status === 'graduated') {
      // 四轮全过 → 出师：淡出移除
      row.style.transition = 'opacity .35s'; row.style.opacity = '0';
      setTimeout(() => row.remove(), 350);
    } else {
      // 推进一轮：原地更新文案，移除勾选框防重复
      row.querySelector('.tip-text').textContent =
        `✅ 已通过 · 第${data.stage}轮（${data.next_review} 前复习）`;
      row.querySelector('.queue-check')?.remove();
    }
  } catch(e) {
    alert('网络错误，打钩失败'); cb.checked = false; cb.disabled = false;
  }
}

// ===== METRIC CARDS =====
function renderMetrics(m, label) {
  const s = m.stats;
  const st = m.streak;
  const ach = m.achievements;
  const ratingStr = (DATA.team.summary.find(u => u.handle === currentHandle) || {}).rating || 'N/A';
  const rank = (DATA.team.summary.find(u => u.handle === currentHandle) || {}).rank || '';

  let html = '';

  // Card 1: Rating（rank 是 CF 全球排名，加标签防止裸数字看不懂）
  html += metricCardHTML(label+' · Rating', String(ratingStr),
    rank ? 'CF 排名 #'+rank : '', 'blue');

  // Card 2: Week AC
  html += metricCardHTML('近7天 AC', String(s.week_ac),
    'AC 率 '+s.ac_rate+'%', 'cyan');

  // Card 3: Total AC
  html += metricCardHTML('累计 AC', String(s.total_ac),
    '累计提交 '+s.total_subs, 'sky');

  // Card 4: Achievements
  html += metricCardHTML('成就进度', ach.earned_count+'/'+ach.total_count,
    '专题 '+s.topic_count+'/15', 'indigo');

  // Card 5: Streak or Broken
  if (st.is_broken) {
    html += cardWrap(
      accentStyle('red'),
      'min-width:200px;flex:1;max-width:320px',
      `<div class="metric-title">连续打卡</div>
       <div class="flame-row">
         <span style="font-size:1.25rem">💔</span>
         <span style="font-size:2rem;font-weight:800;color:#EF4444;line-height:1.2">断训</span>
       </div>
       <div style="color:#FCA5A5;font-size:0.75rem;margin-top:0.25rem">${st.days_since_last} 天未提交</div>`
    );
  } else {
    html += streakFlameHTML(st.current);
  }

  document.getElementById('metricRow').innerHTML = html;
}

function metricCardHTML(title, value, sub, color) {
  const ac = accentColor(color);
  return cardWrap(
    accentStyle(color),
    'min-width:200px;flex:1;max-width:320px',
    `<div class="metric-title">${title}</div>
     <div class="metric-value" style="color:${ac}">${value}</div>
     ${sub ? `<div class="metric-sub">${sub}</div>` : ''}`
  );
}

function streakFlameHTML(days) {
  // 断训=红(语义警告)；活跃打卡走蓝阶由青到靛递进，火焰 emoji 保留热度语义
  let emoji, colorName, valColor;
  if (days <= 0)       { emoji='💔'; colorName='red';    valColor='#f87171'; }
  else if (days < 3)   { emoji='🔥'; colorName='cyan';   valColor='#22d3ee'; }
  else if (days < 7)   { emoji='🔥'; colorName='sky';    valColor='#38bdf8'; }
  else if (days < 14)  { emoji='🔥'; colorName='blue';   valColor='#3f9df6'; }
  else if (days < 30)  { emoji='💥'; colorName='azure';  valColor='#60a5fa'; }
  else                 { emoji='☀️'; colorName='indigo'; valColor='#818cf8'; }

  return cardWrap(
    accentStyle(colorName),
    'min-width:200px;flex:1;max-width:320px',
    `<div class="metric-title">连续打卡</div>
     <div class="flame-row">
       <span style="font-size:1.25rem">${emoji}</span>
       <span style="font-size:2rem;font-weight:800;color:${valColor};line-height:1.2">${days}</span>
       <span style="color:${valColor};font-size:0.875rem;font-weight:600">天</span>
     </div>
     <div class="metric-sub">保持节奏，别断火</div>`
  );
}

function cardWrap(styleObj, extraStyle, inner) {
  const s = Object.entries(styleObj).map(([k,v]) => `${k}:${v}`).join(';');
  const fullStyle = extraStyle ? s + ';' + extraStyle : s;
  return `<div class="card card-accent" style="${fullStyle}">${inner}</div>`;
}

// ===== WEEK ROW =====
function renderWeekRow(m) {
  const w = m.weekly;
  const st = m.streak;
  const nm = m.achievements.next_milestone;
  let html = '';

  // Week AC comparison
  html += weekCompHTML('本周 AC 题数', w.this_week.ac, w.last_week.ac, w.ac_delta, '✅', 'cyan');

  // Week subs comparison
  html += weekCompHTML('本周提交次数', w.this_week.subs, w.last_week.subs, w.subs_delta, '📝', 'sky');

  // Longest streak
  html += cardWrap(
    accentStyle('indigo'),
    'min-width:200px;flex:1;max-width:320px',
    `<div class="metric-title">历史最长打卡</div>
     <div class="flame-row">
       <span style="font-size:1.25rem">🏅</span>
       <span style="font-size:1.75rem;font-weight:700;color:#818cf8;line-height:1.2">${st.longest}</span>
       <span style="color:#818cf8;font-size:0.875rem;font-weight:600">天</span>
     </div>
     <div class="metric-sub">当前 ${st.current} 天</div>`
  );

  // Next milestone
  if (nm) {
    html += cardWrap(
      accentStyle('azure'),
      'min-width:200px;flex:1;max-width:320px',
      `<div class="metric-title">🎯 下一目标</div>
       <div style="font-size:1.125rem;font-weight:700">${nm.icon} ${nm.name}</div>
       <div class="progress-track">
         <div class="progress-fill" style="width:${nm.progress}%;background:linear-gradient(90deg,#3f9df6,#38bdf8)"></div>
       </div>
       <div style="font-size:0.75rem;color:#3f9df6;margin-top:0.25rem">${nm.progress}%</div>`
    );
  }

  document.getElementById('weekRow').innerHTML = html;
}

function weekCompHTML(label, thisVal, lastVal, delta, icon, accent) {
  let arrow, clr;
  if (delta > 0)      { arrow='↑'; clr='#10B981'; }
  else if (delta < 0) { arrow='↓'; clr='#EF4444'; }
  else                { arrow='→'; clr='#6B7280'; }

  return cardWrap(
    accentStyle(accent),
    'min-width:200px;flex:1;max-width:320px',
    `<div class="week-label">${icon} ${label}</div>
     <div class="week-val">${thisVal}</div>
     <div class="flex-row gap-1" style="margin-top:0.25rem;align-items:center">
       <span class="week-delta" style="color:${clr}">${arrow} ${Math.abs(delta)}%</span>
       <span class="week-vs">vs ${lastVal}</span>
     </div>`
  );
}

// ===== ACHIEVEMENTS =====
function renderAchievements(m) {
  const all = m.achievements.achievements;
  const unearned = all.filter(a => !a.earned).slice(0, 12);
  const earned = all.filter(a => a.earned);

  // Section title with count
  document.getElementById('achUnearnedTitle').textContent =
    `🎯 待解锁成就 (${all.filter(a => !a.earned).length})`;

  // Unearned
  document.getElementById('achUnearned').innerHTML = unearned.map((a, i) =>
    achBadgeHTML(a, i * 30)
  ).join('');

  // Earned
  document.getElementById('achEarned').innerHTML = earned.map((a, i) =>
    achBadgeHTML(a, i * 20)
  ).join('');

  // Toggle label
  document.getElementById('toggleLabel').textContent =
    `▸ 已获得成就 (${earned.length}/${m.achievements.total_count})`;
}

function achBadgeHTML(a, delay) {
  let bg, border, txt, bar, shadow, badge;
  let tooltip = '';

  if (a.earned) {
    bg = 'rgba(16,185,129,0.12)'; border = 'rgba(16,185,129,0.4)';
    txt = '#10B981'; bar = '#10B981';
    shadow = '0 0 16px rgba(16,185,129,0.2)'; badge = '✅';
    const dateStr = a.earned_date || '?';
    tooltip = `解锁于 ${dateStr}\n${a.unlock_hint||''}`;
  } else if (a.progress > 70) {
    bg = 'rgba(96,165,250,0.08)'; border = 'rgba(96,165,250,0.28)';
    txt = '#60a5fa'; bar = '#60a5fa';
    shadow = 'none'; badge = '';
    tooltip = `${a.unlock_hint||''}\n进度 ${a.progress}%`;
  } else if (a.progress > 30) {
    bg = 'rgba(107,114,128,0.06)'; border = 'rgba(107,114,128,0.15)';
    txt = '#9CA3AF'; bar = '#6B7280';
    shadow = 'none'; badge = '';
    tooltip = `${a.unlock_hint||''}\n进度 ${a.progress}%`;
  } else {
    bg = 'rgba(107,114,128,0.03)'; border = 'rgba(107,114,128,0.08)';
    txt = '#6B7280'; bar = '#4B5563';
    shadow = 'none'; badge = '';
    tooltip = `${a.unlock_hint||''}\n进度 ${a.progress}%`;
  }

  const inner = `
    <div class="ach-icon">${a.icon}</div>
    <div class="ach-name" style="color:${txt}">${a.name}</div>
    ${a.earned ? `<div style="font-size:0.7rem;margin-top:0.15rem">${badge}</div>` : `
      <div class="progress-track" style="height:0.25rem;margin-top:0.25rem">
        <div class="progress-fill" style="width:${a.progress}%;background:${bar}"></div>
      </div>
      <div class="ach-progress" style="color:${txt}">${a.progress}%</div>
    `}
  `;

  return `<div class="ach-badge" role="listitem" tabindex="0" data-tip="${tooltip.replace(/"/g,'&quot;')}" style="background:${bg};border-color:${border};box-shadow:${shadow};animation:fade-in-up 400ms ease-out ${delay}ms both">${inner}</div>`;
}

function toggleEarned() {
  const body = document.getElementById('earnedBody');
  const label = document.getElementById('toggleLabel');
  const toggle = document.getElementById('toggleEarned');
  const isOpen = body.style.maxHeight !== '0px';
  body.style.maxHeight = isOpen ? '0' : '2000px';
  const earned = DATA.members[currentHandle].achievements.achievements.filter(a => a.earned);
  const total = DATA.members[currentHandle].achievements.total_count;
  label.textContent = `${isOpen ? '▸' : '▾'} 已获得成就 (${earned.length}/${total})`;
  toggle.setAttribute('aria-expanded', !isOpen);
}

// ===== CHARTS =====
let chartInstances = {};

function disposeCharts() {
  Object.values(chartInstances).forEach(c => c.dispose());
  chartInstances = {};
}

// Rating 图装饰：数据项带 tip 字段（涨跌 delta），浏览器端注入函数 formatter
// （JSON 序列化传不了函数，模板 {@tip} 又不展开，只能前端拼装）
function decorateRatingTip(chart) {
  const opt = chart.getOption();
  const s0 = (opt.series || [])[0];
  if (!s0 || !Array.isArray(s0.data) || !s0.data.length) return;
  if (!s0.data[0] || s0.data[0].tip === undefined) return; // 只有 rating 图的数据带 tip
  chart.setOption({
    tooltip: {
      trigger: 'item',
      formatter: function (p) {
        const tip = (p.data && p.data.tip) || '';
        const date = Array.isArray(p.value) ? p.value[0] : (p.name || '');
        const val = Array.isArray(p.value) ? p.value[1] : p.value;
        return (p.seriesName ? p.seriesName + '<br/>' : '') + date + ': ' + val + tip;
      }
    }
  });
}

function initChart(id) {
  const dom = document.getElementById(id);
  if (!dom) return null;
  // Clear and re-create
  dom.innerHTML = '';
  const c = echarts.init(dom, null, {renderer:'canvas'});
  chartInstances[id] = c;
  return c;
}

function renderCharts(m, label) {
  disposeCharts();
  const ch = m.charts;

  // Rating comparison (full team, shared)
  const rcDom = document.getElementById('chartRatingComp');
  rcDom.innerHTML = '';
  const rc = echarts.init(rcDom, null, {renderer:'canvas'});
  chartInstances['ratingComp'] = rc;
  rc.setOption(DATA.team.ratingComparison);
  decorateRatingTip(rc);

  // Calendar heatmap（cellSize 'auto' 格子随容器自适应铺满：
  // 高度只需给合理值，行数估算多几行也不裁剪、少几行也铺满）
  const calEl = document.getElementById('chartCalendar');
  const calOpt = ch.calendarHeatmap;
  if (calEl && calOpt && calOpt.calendar && calOpt.calendar.range) {
    const rng = calOpt.calendar.range;
    const days = Math.ceil((new Date(rng[1]) - new Date(rng[0])) / 86400000) + 1;
    const rsM = Number(rng[0].slice(5, 7)), reM = Number(rng[1].slice(5, 7));
    const months = (reM - rsM + 12) % 12 + 1;
    const rows = Math.ceil(days / 7) + 1;
    calEl.style.height = (rows * 20 + months * 28 + 18) + 'px';
  }
  const cal = initChart('chartCalendar');
  document.getElementById('calTitle').textContent = `训练日历 · ${label}`;
  if (cal) cal.setOption(ch.calendarHeatmap);

  // Verdict pie
  const vp = initChart('chartVerdict');
  document.getElementById('verdictTitle').textContent = `判题分布 · ${label}`;
  if (vp) vp.setOption(ch.verdictPie);

  // Difficulty scatter
  const ds = initChart('chartDiff');
  document.getElementById('diffTitle').textContent = `难度递进 · ${label}`;
  if (ds) ds.setOption(ch.difficultyScatter);

  // Weekly bars
  const wb = initChart('chartWeekly');
  document.getElementById('weeklyTitle').textContent = `每周 AC 题数 · ${label}`;
  if (wb) wb.setOption(ch.weeklyBars);

  // Topic heatmap
  const th = initChart('chartTopic');
  document.getElementById('topicTitle').textContent = `专题掌握 · ${label}`;
  if (th) th.setOption(ch.topicHeatmap);

  // Team radar
  const tr = initChart('chartTeam');
  if (tr) tr.setOption(DATA.team.teamRadar);
}

// ===== TEAM (submissions table) =====
function renderTeam(m, label) {
  const subs = m.recentSubmissions || [];
  let html = '';
  for (const r of subs.slice(0, 15)) {
    const v = r.verdict;
    let vc, vw;
    if (v === 'AC') { vc = '#10B981'; vw = '700'; }
    else if (['WA','TLE','MLE','RE','CE'].includes(v)) { vc = '#EF4444'; vw = '500'; }
    else { vc = '#9CA3AF'; vw = '400'; }

    html += `<div class="sub-row">
      <span class="sub-date">${r.date||''}</span>
      <span class="sub-time">${r.time||''}</span>
      <span class="sub-pid">${r.problem||''}</span>
      <span class="sub-plat">${r.platform||''}</span>
      <span class="sub-verdict" style="font-weight:${vw};color:${vc}">${v}</span>
    </div>`;
  }
  document.getElementById('subTable').innerHTML = html || '<div style="color:rgba(255,255,255,0.3);font-size:0.875rem">暂无提交记录</div>';
}

// ===== RESIZE HANDLER =====
window.addEventListener('resize', () => {
  Object.values(chartInstances).forEach(c => c.resize());
});

// ===== AURORA 鼠标交互 =====
// 只更新 CSS 变量，渐变渲染交给浏览器合成器，保持流畅
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  let mx = window.innerWidth / 2, my = window.innerHeight / 3, raf = null;
  window.addEventListener('mousemove', (e) => {
    mx = e.clientX; my = e.clientY;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      const doc = document.documentElement.style;
      doc.setProperty('--mx', mx + 'px');
      doc.setProperty('--my', my + 'px');
      // 视差系数: 鼠标在视口内的归一化位置 (-0.5 ~ 0.5)
      doc.setProperty('--px', (mx / window.innerWidth - 0.5).toFixed(3));
      doc.setProperty('--py', (my / window.innerHeight - 0.5).toFixed(3));
      raf = null;
    });
  });
}

// ===== BOOT =====
init();
</script>
